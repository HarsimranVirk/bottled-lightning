name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel

      - name: Guard version/tag match
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(python -c 'import app; print(app.__version__)')"
          echo "tag=$TAG app.__version__=$VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag v$TAG does not match app/__init__.py __version__ $VERSION"
            exit 1
          fi

      - name: Checksums + launcher bundle
        run: |
          cd dist
          sha256sum ./*.whl > SHA256SUMS.txt
          cd ../launchers
          zip -r ../dist/bottled-lightning-launchers.zip \
            start.command start.bat fetch_release.py

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/SHA256SUMS.txt
            dist/bottled-lightning-launchers.zip
          generate_release_notes: true
